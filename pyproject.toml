[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-tts-megakernel-adaptation"
version = "0.1.0"
description = "Streaming Qwen3-TTS talker decode using an RTX 5090 CUDA megakernel"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7.0",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "qwen-tts==0.1.1",
  "huggingface-hub",
  "safetensors",
  "numpy",
  "soundfile",
  "librosa",
  "torchaudio",
  "einops",
  "ninja",
  "faster-whisper",
  "gradio",
  "pipecat-ai[google,openai,silero,whisper,websocket]",
  "fastapi",
  "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
